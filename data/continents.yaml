# The six continents, drawn from real geography (designer decision 2026-11-14, replacing the
# procedural blobs of 2026-11-13). Each continent is fitted into its own box on the map at its
# own scale, so every continent has a similar amount of land; distances are true within a
# continent but not between continents.
#
# All coordinates are whole degrees, [longitude, latitude] (east and north positive).
# geo:
#   size: [cols, rows] of the continent's box. Where the boxes sit is shuffled every game
#     (designer 2026-11-14): two rows of three in seeded order with seeded ocean gaps, so knowing
#     a friend's continent does not tell you where it is.
#   x_scale_pct: cosine of the mid-latitude in percent, so shapes are not stretched east-west.
#   size_pct: fitted size in percent of the largest that fits the box (evens out land).
#   outline: the main landmass. islands: other landmasses, each joined to the main one by the
#     shortest causeway. lakes: water cut out of the land.
#   biome_seeds: [biome, lon, lat]; each land hex takes the biome of its nearest seed, with some
#     seeded blending at the borders (map.biome_blend_pct).
#   ridges: polylines of mountains or hills.
# cities: 15 real cities; the first `cities.known_count` are known at the start and the first is
#   the capital. The rest start lost (dormant, ruined or held by aliens; seeded each game).
# resources are relative weights.

