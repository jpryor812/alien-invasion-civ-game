# The six continents. Shapes are procedural (designer decision 2026-11-13: procedural,
# Earth-flavoured); the climate mix, resources and city names give each its character.
# cities: 20 names; the first `cities.known_count` are known at the start, the first is the capital.
# land_pct scales map.land_tiles. biomes and resources are relative weights.

continents:
  north_america:
    status: placeholder
    note: Temperate and prairie core, boreal north, arid south-west.
    name: North America
    order: 0
    land_pct: 105
    biomes: {temperate: 30, prairie: 25, boreal: 20, arid: 12, arctic: 6, tropical: 7}
    resources: {wheat: 15, cattle: 15, fish: 10, timber: 10, gold_ore: 5, coffee: 3, oil: 12, aluminum: 8, uranium: 5, rare_earths: 4}
    cities: [Toronto, New York, Los Angeles, Mexico City, Chicago, Houston, Vancouver, Montreal,
             Atlanta, Denver, Seattle, Miami, Phoenix, Monterrey, Guadalajara, Havana, Calgary,
             Boston, San Francisco, Panama City]
  south_america:
