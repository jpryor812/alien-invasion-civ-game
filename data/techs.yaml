  applied_ai: {status: placeholder, note: Research labs., tree: production, tier: 2, cost: 200, prereqs: [advanced_manufacturing], known_at_start: false}
  fusion_power: {status: placeholder, note: Fusion plants., tree: production, tier: 4, cost: 600, prereqs: [quantum_theory], known_at_start: false}
  nanofabrication: {status: placeholder, note: Late industry; effects later., tree: production, tier: 5, cost: 950, prereqs: [fusion_power], known_at_start: false}

