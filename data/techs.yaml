  biotech_medicine: {status: placeholder, note: Hospitals., tree: economic, tier: 4, cost: 600, prereqs: [vertical_farming], known_at_start: false}
  automated_markets: {status: placeholder, note: Merge with production; effects later., tree: economic, tier: 5, cost: 950, prereqs: [global_logistics], known_at_start: false, effects: {purchase_pct: -25}}
  post_scarcity: {status: placeholder, note: Late economy; effects later., tree: economic, tier: 5, cost: 950, prereqs: [sovereign_bonds], known_at_start: false}

  high_speed_rail: {status: placeholder, note: Railways., tree: production, tier: 4, cost: 600, prereqs: [radio_beacon_network], known_at_start: false}
