  drone_warfare: {status: placeholder, note: Drone recon., tree: military, tier: 3, cost: 380, prereqs: [mechanized_warfare], known_at_start: false}
  powered_exoskeletons: {status: placeholder, note: Exo infantry., tree: military, tier: 3, cost: 380, prereqs: [mechanized_warfare], known_at_start: false}
