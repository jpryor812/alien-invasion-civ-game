# Technology (designer 2026-11-14): one branching tree. Two starter branches (Urban Planning,
# Advanced Manufacturing), each tech opening two more: 2, 4, 8 and 16 techs, then a partial fifth
# and sixth level. Every tech has exactly one parent. `tier` is the level; cost follows the level.
# `tree` remains only as a category hint. `effects` are bonuses a known tech gives (beacon/techfx.py;
# designer 2026-11-14 filled every tech that unlocked nothing). Formerly: economic, production and military trees.
# Tier 0 is present-day technology, known at the start (2025). Tiers 1-4 are near-future.
# Cross-tree merges: automated_markets, railguns, hover_armour.
# Techs with no unlocks yet gain effects in later milestones (trade M6, beacons M5).

techs:
  market_economy: {status: calibrated, note: Present day; designer start-era decision., tree: economic, tier: 0, cost: 0, prereqs: [], known_at_start: true}
  industrial_base: {status: calibrated, note: Present day., tree: production, tier: 0, cost: 0, prereqs: [], known_at_start: true}
  modern_warfare: {status: calibrated, note: Present day., tree: military, tier: 0, cost: 0, prereqs: [], known_at_start: true}

  digital_finance: {status: placeholder, note: Financial centres., tree: economic, tier: 3, cost: 380, prereqs: [international_accords], known_at_start: false}
  vertical_farming: {status: placeholder, note: Vertical farms., tree: economic, tier: 3, cost: 380, prereqs: [international_accords], known_at_start: false}
