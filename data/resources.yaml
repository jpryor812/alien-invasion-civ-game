# Resources. Yields apply only once the matching improvement is on the tile (improvement null:
# always). Strategic resources also supply `quantity` units' worth of that resource while the tile
# is improved and its city is connected. No luxury class: the design has no happiness.

resources:
  wheat: {status: placeholder, note: Grain., category: bonus, yields: {food: 2}, improvement: farm, terrains: [grassland, plains], elevations: [flat], quantity: 0}
  cattle: {status: placeholder, note: Livestock., category: bonus, yields: {food: 1, production: 1}, improvement: farm, terrains: [grassland, plains], elevations: [flat], quantity: 0}
  fish: {status: placeholder, note: Coastal fishery., category: bonus, yields: {food: 2}, improvement: null, terrains: [coast], elevations: [flat], quantity: 0}
  timber: {status: placeholder, note: Managed forest., category: bonus, yields: {production: 2}, improvement: extractor, terrains: [grassland, plains, tundra], elevations: [flat], quantity: 0}
  gold_ore: {status: placeholder, note: Precious metals., category: bonus, yields: {gold: 3}, improvement: mine, terrains: [grassland, plains, desert, tundra], elevations: [hills], quantity: 0}
  coffee: {status: placeholder, note: Cash crop., category: bonus, yields: {food: 1, gold: 2}, improvement: farm, terrains: [grassland], elevations: [flat], quantity: 0}
  oil: {status: placeholder, note: Fuel for armour., category: strategic, yields: {production: 1}, improvement: extractor, terrains: [desert, tundra, plains], elevations: [flat], quantity: 2}
  aluminum: {status: placeholder, note: Light alloys., category: strategic, yields: {production: 1}, improvement: mine, terrains: [grassland, plains, desert, tundra], elevations: [hills], quantity: 2}
  uranium: {status: placeholder, note: Reactor fuel (used from M5 on)., category: strategic, yields: {production: 1}, improvement: mine, terrains: [plains, desert, tundra], elevations: [flat, hills], quantity: 1}
  rare_earths: {status: placeholder, note: Advanced electronics., category: strategic, yields: {gold: 1}, improvement: mine, terrains: [plains, desert, tundra], elevations: [hills], quantity: 2}
