# Unit types. moves are move points (x movement.scale sub-points). strength defends and attacks in
# melee; ranged_strength and range are for ranged attacks (0 = none). vision is sight radius.
# Optional: requires_resource (one strategic resource per unit member).
# Alien units: optional alien_tech (data/aliens.yaml) unlocks them; cost is alien production.

