# The settlement sandbox (docs/SPEC_M15.md, designer 2026-11-16): goods from land, buildings in hex
# slots, walls on hex edges, raids and the Galactic Exchange. One city and its six neighbours.

start:
  status: placeholder
  note: What the city has on turn 0 - banks of goods, gold, people, and buildings already standing
    (a farm and a lumber camp, so food and timber flow from the first turn).
  goods: {grain: 40, timber: 40, stone: 0, iron: 0}
  gold: 60
  pop: 4

terrain:
  status: placeholder
  note: The six hexes around the city are dealt by seed from this layout (shuffled), so every city
    has grain, timber and stone, and one hills hex holds iron. slots - building slots per hex.
  centre: {terrain: plains, slots: 6}
  ring:
    - {terrain: plains, resource: grain, slots: 3}
    - {terrain: grassland, resource: grain, slots: 3}
    - {terrain: forest, resource: timber, slots: 2}
    - {terrain: forest, resource: timber, slots: 2}
    - {terrain: hills, resource: stone, slots: 2}
    - {terrain: hills, resource: iron, slots: 2}

goods:
  status: placeholder
  note: Stockpiled goods. cap - storage before granaries and warehouses; the Exchange's base price
    in gold.
  grain: {name: Grain, cap: 120, price: 2}
  timber: {name: Timber, cap: 100, price: 3}
  stone: {name: Stone, cap: 100, price: 4}
  iron: {name: Iron, cap: 60, price: 8}

people:
  status: placeholder
  note: Each person eats `eats` grain a turn. When the city has room (houses), growing costs
    `grow_cost` grain from the store (taken when at least that much is left after eating). Hunger
    (not enough grain) loses one person. room - people the city hall houses; a house adds more.
  eats: 2
  grow_cost: 30
  room: 6

labour:
  status: placeholder
  note: Construction work available each turn - base plus each staffed workshop.
  base: 3

buildings:
  status: placeholder
  note: Slot buildings. needs - the hex resource it must stand on (none - anywhere); makes - goods
    a turn when staffed (one worker); cost - materials paid when ordered; labour - work to finish;
    store - extra storage; room - extra people; labour_bonus - extra labour; strength - city
    strength it adds (every building adds some).
  city_hall: {name: City hall, info: The heart of the city., fixed: true, strength: 10}
  farm: {name: Farm, info: Grows grain on a grain field., needs: grain, makes: {grain: 12}, cost: {timber: 20}, labour: 4, strength: 1}
  lumber_camp: {name: Lumber camp, info: Cuts timber in a forest., needs: timber, makes: {timber: 10}, cost: {timber: 10}, labour: 3, strength: 1}
  quarry: {name: Quarry, info: Cuts stone from the hills., needs: stone, makes: {stone: 8}, cost: {timber: 25}, labour: 5, strength: 2}
  iron_mine: {name: Iron mine, info: Digs iron ore from the hills., needs: iron, makes: {iron: 5}, cost: {timber: 30, stone: 20}, labour: 6, strength: 2}
  granary: {name: Granary, info: Stores more grain against bad turns and raids., cost: {timber: 25}, labour: 3, store: {grain: 150}, strength: 1}
  warehouse: {name: Warehouse, info: Stores more timber, stone and iron., cost: {timber: 30, stone: 15}, labour: 4, store: {timber: 120, stone: 120, iron: 60}, strength: 2}
  house: {name: House, info: Room for 3 more people., cost: {timber: 15}, labour: 2, room: 3, strength: 1}
  workshop: {name: Workshop, info: More labour for building., cost: {timber: 20, stone: 10}, labour: 4, labour_bonus: 3, strength: 2}
  watchtower: {name: Watchtower, info: Archers on a tower - strength for the whole city., cost: {timber: 20, stone: 20}, labour: 4, strength: 8}

walls:
  status: placeholder
  note: Wall segments stand on the territory's outer hex edges. Each material sets its strength
    (counted against a raid on that hex) and HP (raids wear it down; at 0 it falls). Hardening an
    existing wall replaces it.
  wood: {name: Wooden palisade, cost: {timber: 15}, labour: 2, strength: 10, hp: 40}
  stone: {name: Stone wall, cost: {stone: 20}, labour: 3, strength: 22, hp: 90}
  iron: {name: Iron-clad wall, cost: {stone: 10, iron: 15}, labour: 4, strength: 40, hp: 160}

raids:
  status: placeholder
  note: The first raid comes on turn `first`, then every `every` turns, seen `warning` turns
    ahead, at a seeded outer hex. Strength - base + per_raid x raids so far. Defence - the city's
    base strength (buildings) x city_share_pct / 100 plus the walls on the struck hex's outer
    edges. Held - the walls lose wall_damage_pct of the raid's strength as HP, spread over them.
    Broken - the raiders wreck the best building on that hex and burn burn_pct of every store.
    Calibration (2026-11-16) - a scripted sensible player (walls on the scouted hex, then farms,
    quarry, houses, workshop, granary, watchtower) held 38 of 50 raids over 30 turns on 10 seeds;
    with city_share_pct 50 it held 19 of 50.
  first: 6
  every: 5
  warning: 2
  base: 18
  per_raid: 9
  city_share_pct: 100
  wall_damage_pct: 60
  burn_pct: 25

exchange:
  status: placeholder
  note: The Galactic Exchange - neutral alien traders. They buy at sell_pct and sell at buy_pct of
    the current price. The price index (percent of the base price) drifts by up to drift_pct a
    turn (seeded), sags sale_drop_pct per 10 units sold to them, rises the same per 10 bought,
    stays within min_pct to max_pct, and drifts back toward 100.
  sell_pct: 60
  buy_pct: 160
  drift_pct: 8
  sale_drop_pct: 2
  min_pct: 50
  max_pct: 180
