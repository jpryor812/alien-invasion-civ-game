<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settlement Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Cinzel:wght@500;700&display=swap">
  <link rel="stylesheet" href="sandbox.css">
</head>
<body>
  <header id="bar">
    <a class="brand" href="/" title="Back to the main game">BEACON</a>
    <span class="era">Era II · Rebuild</span>
    <div id="goods"></div>
    <div id="stats"></div>
    <button id="exchange-btn" title="The Galactic Exchange">Exchange</button>
    <button id="new-btn" title="A new city (new seed)">New city</button>
  </header>
  <main>
    <canvas id="view"></canvas>
    <div id="raid" class="hidden"></div>
    <aside id="panel"></aside>
    <aside id="queue"></aside>
    <aside id="log"></aside>
    <button id="end">End turn</button>
    <div id="banner" class="hidden"></div>
    <div id="tip" class="hidden"></div>
  </main>
  <div id="modal" class="hidden"><div class="box"><button class="close">×</button><div id="modal-body"></div></div></div>
  <script src="sandbox.js"></script>
</body>
</html>
