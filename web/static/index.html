<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">BEACON</div>
    <div id="turninfo" class="stat"></div>
    <div id="gold" class="stat" title="Treasury (change per turn)"></div>
    <div id="science" class="stat" title="Science per turn and current research"></div>
    <div id="beacon" class="stat" title="Beacon points toward the next recruit"></div>
    <div id="threat" class="stat" title="The mothership and the alien cities you know of"></div>
    <nav>
      <button data-screen="techs" title="Tech tree (T)">Tech</button>
      <button data-screen="council" title="Recruits and councils (C)">Council</button>
      <button data-screen="diplomacy" title="Deals, aid and alliances (D)">Diplomacy</button>
      <button data-screen="projects" title="Barrage and espionage (P)">Projects</button>
      <button data-screen="scores" title="MVP ranking">Scores</button>
      <button data-screen="menu" title="New game, save, load">Menu</button>
    </nav>
  </header>

  <main id="stage">
    <canvas id="map"></canvas>
    <aside id="side" class="panel hidden"></aside>
    <aside id="right" class="panel">
      <h3>Needs attention</h3>
      <ul id="pending"></ul>
      <h3>This turn</h3>
      <ul id="log"></ul>
    </aside>
    <div id="tooltip" class="hidden"></div>
    <div id="bottom">
      <canvas id="minimap" width="240" height="144" title="Click to jump"></canvas>
      <button id="endturn">Next turn</button>
    </div>
    <div id="toast" class="hidden"></div>
  </main>

  <div id="modal" class="hidden">
    <div class="modal-box">
      <button class="close" title="Close (Esc)">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
